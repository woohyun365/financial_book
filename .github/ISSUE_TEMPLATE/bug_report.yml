name: "Bug report"
description: "버그 리포트"
title: "[BUG] "
labels: ["type:bug"]
body:
  - type: markdown
    attributes:
      value: |
        버그는 “재현 가능성”이 핵심입니다. 가능한 자세히 적어주세요.

  - type: textarea
    id: summary
    attributes:
      label: 요약
      description: "무슨 문제가 발생했나요?"
      placeholder: "예) 가계부 저장 후 캘린더에 항목이 보이지 않음"
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: 재현 단계 (Steps to reproduce)
      description: "순서대로 적어주세요."
      placeholder: |
        1) 2026-01-27 날짜 선택
        2) 지출 120,000원 + 사진 첨부
        3) 저장 클릭
        4) 캘린더로 돌아가면 항목이 없음
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 기대 결과 (Expected)
      placeholder: "예) 저장 직후 캘린더에 항목이 표시된다"
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: 실제 결과 (Actual)
      placeholder: "예) 저장은 성공 토스트가 뜨지만 항목이 표시되지 않는다"
    validations:
      required: true

  - type: dropdown
    id: severity
    attributes:
      label: 심각도 (Severity)
      options:
        - S1 - 서비스 사용 불가/데이터 손상
        - S2 - 핵심 기능 장애(우회 가능)
        - S3 - 부분 기능/UX 문제
        - S4 - 경미한 문제
    validations:
      required: true

  - type: textarea
    id: env
    attributes:
      label: 환경 정보
      description: "브라우저/OS/디바이스/버전 등"
      placeholder: |
        - OS: macOS 14
        - Browser: Chrome 143
        - App: web@1.2.3
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: 로그/스크린샷
      description: "에러 메시지, 네트워크 탭, 콘솔 로그 등"
    validations:
      required: false

