name: "Feature request"
description: "새 기능 제안/개발 이슈"
title: "[FEAT] "
labels: ["type:feature"]
body:
  - type: markdown
    attributes:
      value: |
        기능 요청 템플릿입니다. “무엇/왜/완료조건”을 최소한으로 명확히 작성해 주세요.

  - type: textarea
    id: problem
    attributes:
      label: 문제/배경 (Problem)
      description: "왜 필요한가요? 어떤 불편/기회가 있나요?"
      placeholder: "예) 큰 지출이 발생해도 사용자가 놓쳐서 다음 달에야 알게 된다."
    validations:
      required: true

  - type: textarea
    id: goal
    attributes:
      label: 목표 (Goal)
      description: "이 기능으로 달성하고 싶은 결과는 무엇인가요?"
      placeholder: "예) 큰 지출 발생 시 1시간 내 알림을 통해 사용자가 인지한다."
    validations:
      required: true

  - type: textarea
    id: scope
    attributes:
      label: 범위 (In scope / Out of scope)
      description: "이번 이슈에서 할 것/하지 않을 것을 분리해 주세요."
      placeholder: |
        In:
        - 예) 알림 임계치 기본값 제공, 설정 UI 제공
        Out:
        - 예) SMS 발송(Phase 2)
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: 완료 조건 (Acceptance Criteria)
      description: "체크리스트로 작성해 주세요."
      placeholder: |
        - [ ] 사용자가 10만원 이상 지출을 등록하면 알림 후보가 생성된다
        - [ ] 알림 설정에서 임계치를 변경할 수 있다
        - [ ] 알림이 노출되면 ‘확인’ 처리 가능하다
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: 영향 범위 (Area)
      description: "어디가 영향을 받나요?"
      multiple: true
      options:
        - area:web
        - area:api
        - area:db
        - area:infra
        - area:ai
    validations:
      required: true

  - type: textarea
    id: api_db
    attributes:
      label: API/DB 변경 사항 (있으면)
      description: "엔드포인트/테이블/필드 등 변경이 있다면 적어주세요."
      placeholder: |
        API:
        - POST /ledger
        DB:
        - ledger 테이블에 threshold_exceeded 컬럼 추가
    validations:
      required: false

  - type: textarea
    id: observability
    attributes:
      label: 로그/지표/모니터링 (선택)
      description: "배포 후 잘 동작하는지 어떻게 확인하나요?"
      placeholder: |
        - 이벤트: big_spend_alert_shown
        - API p95 latency 확인: /ledger
        - 에러 모니터링: Sentry
    validations:
      required: false

  - type: textarea
    id: notes
    attributes:
      label: 추가 컨텍스트
      description: "스크린샷/레퍼런스 링크/메모"
    validations:
      required: false

